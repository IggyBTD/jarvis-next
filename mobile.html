<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- R1-2: images and media from this page or data: and blob: only, also when the dev server (which sends no CSP) serves it -->
  <meta http-equiv="Content-Security-Policy" content="img-src 'self' data: blob:; media-src 'self' data: blob:; object-src 'none'">
  <!-- viewport-fit=cover: the app draws edge to edge and keeps clear of the notch and the home indicator itself (safe-area insets).
       Zoom is off (a real app does not zoom); inputs are 16 pt anyway. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="JARVIS">
  <meta name="format-detection" content="telephone=no">
  <title>JARVIS</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest-mobile.webmanifest">
  <!-- nodes design (mobile-classic.html keeps the previous look) -->
  <link rel="stylesheet" href="/src/nodes/tokens.css">
  <link rel="stylesheet" href="/src/ui/diagram.css">
  <link rel="stylesheet" href="/src/ui/base.css">
  <link rel="stylesheet" href="/src/ui/mobile.css">
  <link rel="stylesheet" href="/src/nodes/mobile.css">
</head>
<body>
<div id="m-app" data-state="connecting" data-page="chat" data-empty="true">
  <header class="m-bar">
    <button type="button" id="m-menu" class="m-round" aria-label="Chats and settings" aria-haspopup="dialog"><span class="icon" data-icon="menu" aria-hidden="true"></span></button>
    <button type="button" id="m-title" class="m-title" aria-haspopup="dialog">
      <span class="m-title-row"><span class="m-title-main" id="m-title-main">JARVIS</span><span class="icon" data-icon="chevron-down" aria-hidden="true"></span></span>
      <span class="m-title-sub" id="m-title-sub"></span>
    </button>
    <div class="m-bar-right" id="m-bar-right"></div>
  </header>

  <div id="m-banner" class="m-banner" role="status" hidden>
    <span id="m-banner-text"></span>
    <button type="button" id="m-banner-act" class="m-banner-act" hidden></button>
  </div>

  <main id="m-scroll" class="m-scroll">
    <section id="m-empty" class="m-empty">
      <span class="logo logo-hero" data-mesh-logo="hero" data-mesh-input="m-input" aria-label="JARVIS"></span>
      <h1 class="m-greet"><span id="m-greet">Hello</span><b>.</b></h1>
      <p class="m-greet-sub" id="m-greet-sub">Running on your PC.</p>
    </section>
    <div id="m-log" class="m-log" role="log" aria-live="polite" aria-label="Conversation"></div>
    <button type="button" id="m-jump" class="m-jump" aria-label="Jump to the latest message" hidden><span class="icon" data-icon="chevron-down" aria-hidden="true"></span></button>
  </main>

  <!-- a div, not a form: inside a form iOS adds its previous / next / done bar above the keyboard -->
  <div id="m-composer" class="m-composer" role="form" aria-label="Message">
    <div class="m-field">
      <button type="button" id="m-plus" class="m-round" aria-label="Chat options"><span class="icon" data-icon="plus" aria-hidden="true"></span></button>
      <!-- A plain textarea: the iPhone's own keyboard, autocorrect, predictive text and dictation all work. Return makes a new line. -->
      <textarea id="m-input" rows="1" placeholder="Message JARVIS" aria-label="Message" enterkeyhint="enter" autocapitalize="sentences" autocorrect="on" spellcheck="true" autocomplete="off"></textarea>
      <button type="button" id="m-send" class="m-send" aria-label="Send" aria-disabled="true"><span class="icon" data-icon="send" aria-hidden="true"></span></button>
    </div>
  </div>

  <section id="m-p-projects" class="m-page" aria-label="Projects" hidden>
    <input type="search" id="m-q-projects" class="m-search m-page-search" placeholder="Search projects" aria-label="Search projects" autocomplete="off" hidden>
    <div id="m-projects" class="m-plist"></div>
    <button type="button" id="m-fab-project" class="m-pill m-fab"><span class="icon" data-icon="plus" aria-hidden="true"></span>New project</button>
  </section>
  <section id="m-p-code" class="m-page" aria-label="Code" hidden>
    <input type="search" id="m-q-code" class="m-search m-page-search" placeholder="Search sessions" aria-label="Search sessions" autocomplete="off" hidden>
    <div id="m-code" class="m-plist"></div>
    <button type="button" id="m-fab-session" class="m-pill m-fab"><span class="icon" data-icon="plus" aria-hidden="true"></span>New session</button>
  </section>
  <section id="m-p-artifacts" class="m-page" aria-label="Artifacts" hidden>
    <div id="m-artifacts" class="m-plist"></div>
  </section>

  <nav id="m-tabs" class="m-tabs" aria-label="Sections">
    <button type="button" data-tab="chat" aria-current="page"><span class="icon" data-icon="chat" aria-hidden="true"></span><span>Chat</span></button>
    <button type="button" data-tab="projects"><span class="icon" data-icon="folder" aria-hidden="true"></span><span>Projects</span></button>
    <button type="button" data-tab="code"><span class="icon" data-icon="code" aria-hidden="true"></span><span>Code</span></button>
    <button type="button" data-tab="artifacts"><span class="icon" data-icon="artifacts" aria-hidden="true"></span><span>Artifacts</span></button>
  </nav>
</div>

<div id="m-drawer" class="m-drawer" inert>
  <div class="m-drawer-scrim" id="m-drawer-scrim"></div>
  <aside class="m-drawer-panel" role="dialog" aria-label="Chats">
    <div class="m-drawer-head">
      <span class="m-drawer-brand">JARVIS</span>
      <button type="button" id="m-d-search" class="m-round" aria-label="Search chats"><span class="icon" data-icon="search" aria-hidden="true"></span></button>
    </div>
    <input type="search" id="m-d-q" class="m-search" placeholder="Search chats" aria-label="Search chats" autocomplete="off" hidden>
    <div id="m-d-list" class="m-d-list"></div>
    <div class="m-drawer-foot">
      <button type="button" id="m-d-me" class="m-round" aria-label="Settings"><span class="icon" data-icon="settings" aria-hidden="true"></span></button>
      <button type="button" id="m-d-new" class="m-pill"><span class="icon" data-icon="plus" aria-hidden="true"></span>New chat</button>
    </div>
  </aside>
</div>
<div id="m-sheets"></div>
<script type="module" src="/src/mobile/main.js"></script>
</body>
</html>
